<!DOCTYPE html>
<html lang="en" data-tema="oscuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Handicapper — Sports data and analysis for smarter predictions</title>
  <link rel="icon" type="image/png" href="assets/imagenes/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

  <header class="top">
    <button class="hamb" id="hamb" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="marca" id="marca">
      <img class="logo-img" id="logo-img" alt="Handicapper">
      <span class="logo-txt"><span class="dot"></span>Handi<b>capper</b></span>
    </div>
    <label class="buscar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" width="16" height="16"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="buscar-input" placeholder="Search team or league">
    </label>
    <div class="acc">
      <button class="util-btn" id="idioma-btn" aria-label="Language"></button>
      <button class="util-btn" id="tema-btn" aria-label="Theme"></button>
      <button class="btn-oro">Subscribe · $1.99</button>
    </div>
  </header>

  <!-- Menú lateral (móvil): se abre con la hamburguesa -->
  <div class="drawer-bg" id="drawer-bg"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-cab">
      <span class="eyebrow" id="drawer-t">Sports</span>
      <button class="drawer-x" id="drawer-x" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="drawer-ligas"></div>
  </aside>

  <div class="marco">
    <aside class="side">
      <div class="eyebrow">Sports</div>
      <div id="lista-ligas"></div>
    </aside>

    <main class="centro">
      <div class="pestanas" id="pestanas"></div>
      <div id="lista"></div>
    </main>

    <aside class="panel" id="panel">
      <div class="vacio">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="34" height="34"><path d="M4 4v16h16"/><path d="M7 14l3-3 3 2 4-6"/></svg></div>
        Pick a match to see the full analysis.
      </div>
    </aside>
  </div>

  <div class="hoja-detalle" id="hoja">
    <button class="cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M15 5l-7 7 7 7"/></svg> Back</button>
    <div class="hoja-cuerpo"></div>
  </div>

  <nav class="tabbar" id="tabbar"></nav>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
